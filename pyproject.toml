[project]
name = "escriba"
version = "1.0.0"
description = "Escriba: an agentic clinical medical scribe. Autonomous Planning, Human Approval."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "twilio>=9.0,<10.0",
    "openai>=2.54,<3.0",
]

[tool.vercel]
entrypoint = "index:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["twilio.*"]
ignore_missing_imports = true
